<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordbank</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-monospace, monospace; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.2rem; }
  input, button { font: inherit; padding: .4rem .6rem; }
  input[type=text] { width: 60%; }
  button { cursor: pointer; }
  section { margin-top: 2rem; border-top: 1px solid #8884; padding-top: 1rem; }
  .card { border: 1px solid #8884; border-radius: 6px; padding: .8rem; margin-top: .8rem; }
  .pos { opacity: .6; font-style: italic; }
  .ety { opacity: .8; font-size: .9em; margin-top: .4rem; }
  .error { color: #d33; }
  .saved-check { color: #2a5; }
  .definition { margin-bottom: .8rem; }
  ul { padding-left: 1.2rem; }
  li { margin-bottom: .3rem; }
  summary { cursor: pointer; }
  #quizAnswer { display: none; }
  .audio-btn { border: none; background: none; cursor: pointer; font-size: 1.1em; padding: 0 .3rem; }
  .tag-input { width: 40%; margin-top: .5rem; }
  .tag { display: inline-block; background: #8882; border-radius: 999px; padding: .1rem .6rem; font-size: .85em; margin: 0 .2rem .2rem 0; cursor: pointer; }
  .tag-filter { margin-bottom: 1rem; }
  .srs-note { opacity: .6; font-size: .85em; }
  .due-badge { display: inline-block; border: 1px solid #8884; border-radius: 999px; padding: .1rem .6rem; font-size: .8em; opacity: .7; margin-left: .3rem; }
  .due-badge.due-now { border-color: #2a5; color: #2a5; opacity: 1; }
</style>
</head>
<body>
<h1>Wordbank</h1>

<section id="lookup">
  <input type="text" id="wordInput" placeholder="type a word…" autofocus>
  <button id="lookupBtn">Look up</button>
  <div id="lookupResult"></div>
</section>

<section id="quiz">
  <h2>Quiz</h2>
  <button id="quizBtn">Quiz me on a random word</button>
  <div id="quizArea"></div>
</section>

<section id="saved">
  <details>
    <summary>Show saved words (<span id="wordCount">0</span>)</summary>
    <div class="tag-filter">
      <input type="text" id="tagFilter" placeholder="filter by tag…">
      <button id="clearFilterBtn">Clear</button>
    </div>
    <ul id="wordList"></ul>
  </details>
</section>

<script>
const $ = (id) => document.getElementById(id);
let currentLookup = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function audioButton(url) {
  return url ? `<button class="audio-btn" onclick="new Audio('${url}').play()" title="Play pronunciation">🔊</button>` : '';
}

function dueBadge(nextReview) {
  const dueAt = new Date(nextReview.replace(' ', 'T') + 'Z'); // stored as UTC via SQLite datetime('now')
  const days = Math.ceil((dueAt - Date.now()) / 86400000);
  return days <= 0
    ? '<span class="due-badge due-now">due now</span>'
    : `<span class="due-badge">due in ${days}d</span>`;
}

async function doLookup() {
  const word = $('wordInput').value.trim();
  if (!word) return;
  $('lookupResult').innerHTML = 'Looking up…';
  try {
    currentLookup = await api(`/api/lookup?word=${encodeURIComponent(word)}`);
    $('lookupResult').innerHTML = `
      <div class="card">
        <strong>${currentLookup.word}</strong>
        <span class="pos">${currentLookup.partOfSpeech ?? ''}</span>
        ${audioButton(currentLookup.audioUrl)}
        ${currentLookup.saved ? '<span><span class="saved-check">✓</span> already in your bank</span>' : ''}
        <div class="definition">${currentLookup.definition}</div>
        ${currentLookup.etymology ? `<div class="ety">Etymology: ${currentLookup.etymology}</div>` : ''}
        ${currentLookup.synonyms?.length ? `<div class="ety">Synonyms: ${currentLookup.synonyms.join(', ')}</div>` : ''}
        ${currentLookup.antonyms?.length ? `<div class="ety">Antonyms: ${currentLookup.antonyms.join(', ')}</div>` : ''}
        ${currentLookup.saved ? '' : `
          <div><input type="text" id="tagInput" class="tag-input" placeholder="tags, comma-separated…"></div>
          <button id="saveBtn">Save to database</button>`}
      </div>`;
    if ($('saveBtn')) $('saveBtn').onclick = doSave;
  } catch (err) {
    $('lookupResult').innerHTML = `<p class="error">${err.message}</p>`;
  }
}

async function doSave() {
  const tags = $('tagInput')?.value.trim() || null;
  await api('/api/words', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...currentLookup, tags }),
  });
  $('wordInput').value = '';
  $('lookupResult').innerHTML = '<p>Saved.</p>';
  loadWords();
}

async function editTags(id, currentTags) {
  const tags = prompt('Tags (comma-separated):', currentTags ?? '');
  if (tags === null) return;
  await api(`/api/words/${id}/tags`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tags: tags.trim() || null }),
  });
  loadWords($('tagFilter').value.trim());
}

async function loadWords(tag) {
  const words = await api(`/api/words${tag ? `?tag=${encodeURIComponent(tag)}` : ''}`);
  $('wordCount').textContent = words.length;
  $('wordList').innerHTML = words
    .map((w) => `<li>
        <strong>${w.word}</strong> <span class="pos">${w.part_of_speech ?? ''}</span>
        ${audioButton(w.audio_url)}
        ${dueBadge(w.next_review)}
        — ${w.definition}${w.synonyms ? ` <span class="ety">(syn: ${w.synonyms})</span>` : ''}
        <div>
          ${(w.tags ?? '').split(',').map((t) => t.trim()).filter(Boolean)
            .map((t) => `<span class="tag" onclick="$('tagFilter').value='${t}'; loadWords('${t}')">${t}</span>`).join('')}
          <span class="tag" onclick="editTags(${w.id}, ${JSON.stringify(w.tags ?? '').replace(/"/g, '&quot;')})">+ edit tags</span>
        </div>
      </li>`)
    .join('');
}

async function startQuiz() {
  try {
    const word = await api('/api/quiz');
    $('quizArea').innerHTML = `
      <div class="card">
        <p>What does <strong>${word.word}</strong> ${audioButton(word.audio_url)} mean?</p>
        <button id="revealBtn">Reveal answer</button>
        <div id="quizAnswer">
          <p>${word.definition}</p>
          <button data-correct="true" class="gradeBtn">I knew it</button>
          <button data-correct="false" class="gradeBtn">I didn't know it</button>
          <p id="srsNote" class="srs-note"></p>
        </div>
      </div>`;
    $('revealBtn').onclick = () => { $('quizAnswer').style.display = 'block'; };
    document.querySelectorAll('.gradeBtn').forEach((btn) => {
      btn.onclick = async () => {
        const result = await api(`/api/quiz/${word.id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correct: btn.dataset.correct === 'true' }),
        });
        $('srsNote').textContent = `Next review in ${result.nextIntervalDays} day${result.nextIntervalDays === 1 ? '' : 's'}…`;
        setTimeout(startQuiz, 3000);
      };
    });
  } catch (err) {
    $('quizArea').innerHTML = `<p class="error">${err.message}</p>`;
  }
}

$('lookupBtn').onclick = doLookup;
$('wordInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLookup(); });
$('quizBtn').onclick = startQuiz;
$('tagFilter').addEventListener('input', (e) => loadWords(e.target.value.trim()));
$('clearFilterBtn').onclick = () => { $('tagFilter').value = ''; loadWords(); };

loadWords();
</script>
</body>
</html>
